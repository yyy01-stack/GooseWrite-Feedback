name: Bug Report
description: Create a report to help us fix something that is not working.
title: "[BUG] "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug for GooseWrite!
        Please fill in the details below so we can reproduce and fix it quickly.
  - type: input
    id: version
    attributes:
      label: GooseWrite Version
      description: Which version of GooseWrite are you using?
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: input
    id: macos_version
    attributes:
      label: macOS Version
      description: Which macOS version are you running?
      placeholder: e.g. macOS 14.5 Sonoma
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Tell us exactly what you did to trigger this bug.
      placeholder: |
        1. Open GooseWrite
        2. Create a new project
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Paste error logs or drag screenshots here.
